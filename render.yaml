services:
  - type: web
    # Must match the existing Render service name exactly. The service was
    # created by hand in the dashboard, so Render ignored this file entirely
    # until it was adopted into the Blueprint -- every rewrite and header below
    # was dead. A name that does not match creates a second service instead of
    # adopting this one.
    name: go_zembil_frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # --- Prerendered routes (scripts/prerender.mjs) ------------------------
      # These MUST come before the catch-all below.
      #
      # `npm run build` writes a real HTML file per static route --
      # dist/shop/index.html and so on -- each carrying its own <title>,
      # description, canonical, OG/Twitter card, JSON-LD and a no-JS content
      # fallback. That is the only thing a crawler which does not execute
      # JavaScript ever sees: every AI crawler, and every social link-preview
      # bot (WhatsApp, Facebook, LinkedIn, Slack).
      #
      # Render documents that it "does not apply redirect or rewrite rules to a
      # path if a resource exists at that path", but it does NOT document
      # whether a request for /shop resolves to dist/shop/index.html by
      # directory index. If it does not, the catch-all below swallows /shop and
      # serves the generic shell instead -- silently, with no error anywhere,
      # and every prerendered file becomes dead weight.
      #
      # Naming each path removes the guess: first match wins, so these resolve
      # correctly whether or not Render's directory-index behaviour cooperates.
      # If it does cooperate, these rules simply never fire.
      #
      # Keep in sync with src/lib/seo-routes.json -- the postbuild step fails
      # the build if a prerendered route is missing here.
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /collections
        destination: /collections/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /custom-orders
        destination: /custom-orders/index.html
      - type: rewrite
        source: /events
        destination: /events/index.html
      - type: rewrite
        source: /gifts
        destination: /gifts/index.html
      - type: rewrite
        source: /occasions
        destination: /occasions/index.html
      - type: rewrite
        source: /packages
        destination: /packages/index.html
      - type: rewrite
        source: /partner-signup
        destination: /partner-signup/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /services
        destination: /services/index.html
      - type: rewrite
        source: /shop
        destination: /shop/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /vendor-signup
        destination: /vendor-signup/index.html

      # Measured 2026-09-17: a rewrite whose destination file does not exist
      # returns HTTP 200 with an EMPTY BODY -- not a 404, and not a fall-through
      # to the catch-all below. So a wildcard `/product/* -> /product/*/index.html`
      # is unsafe: any product created after the last build would serve a blank
      # white page. Per-path rules degrade gracefully instead (no rule matches ->
      # the catch-all serves the app shell), which is why these are enumerated.
      #
      # --- SPA fallback -----------------------------------------------------
      # Everything else is a client-side route (/product/:id, /events/:slug,
      # the dashboards) and is served the app shell.
      - type: rewrite
        source: /*
        destination: /index.html

    # Render reads headers from this key, NOT from `routes`. They previously sat
    # under `routes` as `type: header`, which is not a route type Render accepts
    # (only `redirect` and `rewrite` are) -- so none of the caching rules below
    # were actually being applied to responses.
    headers:
      # --- Security ---------------------------------------------------------
      # Enforced immediately; none of these can break a working page.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(self), payment=(self), interest-cohort=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        # same-origin-allow-popups, not same-origin: Google and Apple sign-in
        # both run in a popup that must keep its handle on the opener.
        value: same-origin-allow-popups

      # --- Content Security Policy ------------------------------------------
      # Report-Only for now. The origin list below is derived from the actual
      # SDK loads in this codebase (Stripe, Chapa, Google Identity, Apple, Maps,
      # GA4, OSM tiles, R2 images) -- but `connect-src` depends on VITE_API_URL,
      # whose production value is set in the Render dashboard rather than here.
      #
      # TO ENFORCE: load the site once, confirm the console logs no CSP
      # violations through sign-in and a full checkout, add the API origin to
      # connect-src if it is not already listed, then rename this header to
      # `Content-Security-Policy`. That rename is the whole change.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: >-
          default-src 'self';
          base-uri 'self';
          object-src 'none';
          frame-ancestors 'none';
          form-action 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://js.chapa.co https://accounts.google.com https://appleid.cdn-apple.com https://maps.googleapis.com https://www.googletagmanager.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com;
          font-src 'self' data: https://fonts.gstatic.com https://fonts.cdnfonts.com;
          img-src 'self' data: blob: https:;
          media-src 'self' https:;
          connect-src 'self' https://*.onrender.com https://*.gogerami.com https://maps.googleapis.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.stripe.com https://api.chapa.co https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org;
          frame-src https://js.stripe.com https://js.chapa.co https://accounts.google.com https://appleid.apple.com https://www.youtube.com https://www.youtube-nocookie.com;
          worker-src 'self' blob:;
          manifest-src 'self'

      # --- Caching ----------------------------------------------------------
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /workbox-*.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
