name: Node.js CI

on:
  push:
    branches: [ "main", "serdesiyon" ]
  pull_request:
    branches: [ "main", "serdesiyon" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # 22, not 18/20: the prebuild/postbuild scripts run with
    # --experimental-strip-types, which needs Node >= 22.6.
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - run: npm ci
    - run: npm run type-check
    - run: npm run lint
    - run: npm run build
      env:
        CI: true
