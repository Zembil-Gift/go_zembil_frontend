<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#FDCB2D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="goGerami" />
    <title>goGerami - Ethiopian Gift Delivery Platform</title>
    <meta name="description" content="goGerami connects hearts across distances through meaningful Ethiopian gifts. Send authentic cultural items, custom products, and heartfelt surprises to your loved ones in Ethiopia." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The Google Identity script is appended from a React effect, so its DNS +
         TLS handshake only starts after the bundle parses. This pulls it forward. -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin>
    <!-- The Gotham stylesheet had no preconnect, so it paid a full DNS + TLS
         handshake on the critical path while the Google faces reused theirs. -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/gotham" />
    <!-- DM Sans previously requested the opsz (optical size) axis and the full
         100..1000 weight range. Nothing in the app varies optical size, and the
         weights actually used are 300-800 (font-light .. font-extrabold), so
         the narrower range below is the same type at a smaller download. The
         italic axis stays: `italic` is used in ~20 places. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
